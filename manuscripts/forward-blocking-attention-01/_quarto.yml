project:
  type: manuscript

manuscript:
  article: index.qmd
  notebooks:
    - notebook: notebooks/01-estimands-estimates.qmd
      title: "1 · Dependent Variables"
    - notebook: notebooks/02-feasibility-study.qmd
      title: "2 · Feasibility Study"
    - notebook: notebooks/03-replication-power.qmd
      title: "3 · Experiment 1: Power Analysis"
    - notebook: notebooks/A1-replication-prereg.qmd
      title: "A1 · Experiment 1: Pre-registration"

format:
  html:
    comments:
      hypothesis: true
  #docx: default
  #jats: default
  pdf:
    documentclass: article

# Notebooks are re-executed only when their source changes. The results are
# kept in `_freeze/` and tracked by git, so that the website is built from them
# without R or the private data. Render a changed notebook before committing it.
execute:
  freeze: auto

bibliography: ../../common/references.bib
csl: ../../common/csl/apa.csl
